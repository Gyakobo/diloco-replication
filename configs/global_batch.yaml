# Fixed GLOBAL batch, as in Charles et al. (2025): 128 sequences per step split across k workers
# (k=2 -> 64 each, k=4 -> 32 each [already run], k=8 -> 16 each). Every k then sees the same tokens,
# and all share one sync baseline (baseline_bs128_steps4000_s0, already run).
# Solo baselines = one worker with the per-worker batch: bs64 (already run) and bs16 (new).
# 13 runs, about 5-6 hours on an RTX 3070 Ti.
base:
  steps: 4000
  seed: 0
runs:
  - {mode: baseline, batch_size: 16}
  - {mode: diloco, k: 2, batch_size: 64, H: 25, outer_lr: 0.7, name: diloco_k2_H25_olr0.7_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 2, batch_size: 64, H: 100, outer_lr: 0.7, name: diloco_k2_H100_olr0.7_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 2, batch_size: 64, H: 500, outer_lr: 0.7, name: diloco_k2_H500_olr0.7_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 2, batch_size: 64, H: 100, outer_lr: 0.5, name: diloco_k2_H100_olr0.5_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 2, batch_size: 64, H: 100, outer_lr: 1.0, name: diloco_k2_H100_olr1.0_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 2, batch_size: 64, H: 100, outer_lr: 1.3, name: diloco_k2_H100_olr1.3_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 8, batch_size: 16, H: 25, outer_lr: 0.7, name: diloco_k8_H25_olr0.7_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 8, batch_size: 16, H: 100, outer_lr: 0.7, name: diloco_k8_H100_olr0.7_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 8, batch_size: 16, H: 500, outer_lr: 0.7, name: diloco_k8_H500_olr0.7_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 8, batch_size: 16, H: 100, outer_lr: 0.5, name: diloco_k8_H100_olr0.5_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 8, batch_size: 16, H: 100, outer_lr: 1.0, name: diloco_k8_H100_olr1.0_m0.9_nest_gb128_steps4000_s0}
  - {mode: diloco, k: 8, batch_size: 16, H: 100, outer_lr: 1.3, name: diloco_k8_H100_olr1.3_m0.9_nest_gb128_steps4000_s0}
